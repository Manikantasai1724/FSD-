<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up — SkillXchange</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="toast-container"></div>

<!-- Navigation -->
<nav class="navbar">
  <div class="container">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-logo">
        <div class="logo-icon">🔄</div>
        SkillXchange
      </a>
      <div class="navbar-actions">
        <button class="theme-toggle">🌙</button>
      </div>
    </div>
  </div>
</nav>

<main class="auth-page">
  <!-- BG Orbs -->
  <div class="auth-bg">
    <div class="hero-orb hero-orb-1"></div>
    <div class="hero-orb hero-orb-2"></div>
  </div>

  <div class="auth-card">
    <!-- Header -->
    <div class="auth-header">
      <div class="logo-icon" style="width:56px;height:56px;font-size:1.5rem;margin:0 auto 16px;">🔄</div>
      <h2>Welcome to SkillXchange</h2>
      <p>The place where knowledge is currency</p>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs" id="auth-tabs">
      <button class="auth-tab active">Login</button>
      <button class="auth-tab">Sign Up</button>
    </div>

    <!-- Login Panel -->
    <div class="auth-form-panel" id="login-panel">
      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <div class="form-control-icon">
            <span class="icon">📧</span>
            <input type="email" id="login-email" class="form-control" placeholder="you@example.com" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="form-control-icon">
            <span class="icon">🔒</span>
            <input type="password" id="login-password" class="form-control" placeholder="Your password" required>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
          <label style="display:flex;align-items:center;gap:8px;font-size:0.875rem;cursor:pointer;">
            <input type="checkbox" style="width:16px;height:16px;accent-color:var(--primary);"> Remember me
          </label>
          <a href="#" style="font-size:0.875rem;color:var(--primary);font-weight:600;">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-bottom:12px;">Login to Account</button>
        <button type="button" class="btn btn-secondary demo-login-btn" style="width:100%;">🎭 Try Demo Account</button>
      </form>

      <div class="auth-divider">or continue with</div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <button class="btn btn-secondary btn-sm" onclick="Toast.info('OAuth coming soon!')">🔍 Google</button>
        <button class="btn btn-secondary btn-sm" onclick="Toast.info('OAuth coming soon!')">🐙 GitHub</button>
      </div>
    </div>

    <!-- Signup Panel -->
    <div class="auth-form-panel" id="signup-panel" style="display:none;">
      <form id="signup-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="signup-name">Full Name</label>
          <div class="form-control-icon">
            <span class="icon">👤</span>
            <input type="text" id="signup-name" class="form-control" placeholder="Your full name" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-email">Email Address</label>
          <div class="form-control-icon">
            <span class="icon">📧</span>
            <input type="email" id="signup-email" class="form-control" placeholder="you@example.com" required>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div class="form-group">
            <label class="form-label" for="signup-password">Password</label>
            <input type="password" id="signup-password" class="form-control" placeholder="Min. 6 chars" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="signup-confirm">Confirm</label>
            <input type="password" id="signup-confirm" class="form-control" placeholder="Repeat password" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Skills I Can Teach <span style="color:var(--text-muted);font-weight:400;">(press Enter to add)</span></label>
          <div class="tags-input-container" id="teach-tags-input">
            <input type="text" placeholder="e.g. Python, Guitar, Cooking...">
          </div>
          <input type="hidden" id="teach-hidden" value="[]">
        </div>

        <div class="form-group">
          <label class="form-label">Skills I Want to Learn <span style="color:var(--text-muted);font-weight:400;">(press Enter to add)</span></label>
          <div class="tags-input-container" id="learn-tags-input">
            <input type="text" placeholder="e.g. UI/UX, Spanish, Yoga...">
          </div>
          <input type="hidden" id="learn-hidden" value="[]">
        </div>

        <div style="margin-bottom:20px;">
          <label style="display:flex;align-items:flex-start;gap:8px;font-size:0.875rem;cursor:pointer;line-height:1.5;">
            <input type="checkbox" required style="width:16px;height:16px;accent-color:var(--primary);margin-top:2px;">
            I agree to the <a href="#" style="color:var(--primary);">Terms of Service</a> and <a href="#" style="color:var(--primary);">Privacy Policy</a>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;">🚀 Create Free Account</button>
      </form>
    </div>

    <div style="text-align:center;margin-top:20px;font-size:0.875rem;color:var(--text-muted);">
      Demo: <strong>alex@example.com</strong> / <strong>pass123</strong>
    </div>
  </div>
</main>

<script src="js/script.js"></script>
</body>
</html>
